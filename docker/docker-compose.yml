# SQL Server para o Decco — alvo `docker` do runner.
#
#   $env:DECCO_SA_PASSWORD = "<senha forte>"     # NUNCA versionar a senha
#   docker compose -f docker/docker-compose.yml up -d
#   dotnet run --project Decco.Database.Runner -- --target docker
#
# O volume nomeado preserva os dados entre `down` e `up`. `down -v` apaga tudo.
services:
  decco-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: decco-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DECCO_SA_PASSWORD:?defina DECCO_SA_PASSWORD no ambiente}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - decco-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s

volumes:
  decco-sql-data:
