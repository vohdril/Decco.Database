# SQL Server for Decco — the runner `docker` target.
#
#   $env:DECCO_SA_PASSWORD = "<strong password>"     # NEVER commit the password
#   docker compose -f docker/docker-compose.yml up -d
#   dotnet run --project Decco.Database.Runner -- --target docker
#
# The named volume keeps the data between `down` and `up`. `down -v` wipes everything.
services:
  decco-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: decco-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DECCO_SA_PASSWORD:?set DECCO_SA_PASSWORD in the environment}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - decco-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s

volumes:
  decco-sql-data:
